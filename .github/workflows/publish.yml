name: Package and publish

on:
  push:
    branches: [master]
    paths-ignore:
      - 'downloads/**'
      - 'design/**'
      - '.vscode/**'
      - 'PUBLISHING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-view-marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      initialized: ${{ steps.plan.outputs.initialized }}
      stale: ${{ steps.plan.outputs.stale }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose release version
        id: plan
        run: python3 scripts/release_version.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test and build the release kit
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --allow-same-version --no-git-tag-version --ignore-scripts
          npm test
          npm run release:zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-view-release-kit
          path: release/*-release-kit.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: build
    if: needs.build.outputs.stale == 'false' && (github.event_name == 'workflow_dispatch' || needs.build.outputs.initialized == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Recheck tags when retrying a publishing job
        id: current
        run: python3 scripts/release_version.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: docs-view-release-kit
          path: release
      - name: Verify the installer from the tested kit
        run: |
          cd release
          unzip -j "docs-view-$RELEASE_VERSION-release-kit.zip" "docs-view-$RELEASE_VERSION.vsix" SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Reserve this version for this commit
        if: steps.current.outputs.stale == 'false' && steps.current.outputs.version == env.RELEASE_VERSION
        run: git push origin "$GITHUB_SHA:refs/tags/marketplace-v$RELEASE_VERSION"
      - name: Publish the packaged VSIX with Trusted Publishing
        if: steps.current.outputs.stale == 'false' && steps.current.outputs.version == env.RELEASE_VERSION
        run: ./node_modules/.bin/vsce publish --oidc --packagePath "release/docs-view-$RELEASE_VERSION.vsix" --skip-duplicate
